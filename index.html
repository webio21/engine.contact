<body>

<div id="app">
  <div id="stream"></div>
  <div class="core">
    <div class="core-mark">
      <div class="orbit"><i></i></div>
      <a class="logo-link" href="https://engine.contact/api">
        <div class="logo">
          <b>GET<br>CONTACT<br>ENGINE<br>API</b>
        </div>
        <img class="logo-overlay" src="img/logo.png" alt="CONTACT ENGINE LOGO">
        <img class="logo-blink" src="img/logo2.png" alt="CONTACT ENGINE LOGO" aria-hidden="true">
      </a>
  </div>

    <div class="auth">
      <a href="https://dash.contact/login"><b>LOGIN</b></a>
      <span class="line"></span>
      <a href="https://dash.contact/signup"><b>SIGN UP</b></a>
    </div>

  <div class="hud">
    <div class="tl">
      CONTACT™ ENGINE<br>
      INTELLIGENCE_API
    </div>

    <div class="tr">
    </div>

    <div class="bl">
      <a href="documentation"><b>DOCUMENTATION</b></a>
      <span class="line"></span>
      MODEL_ROUTING / VERIFICATION / SYNTHESIS
    </div>
  </div>

</div>

<script>

const stream = document.getElementById('stream');

const chars =
  '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';

const randomCode = (length=22) =>
  Array.from(
    {length},
    () => chars[Math.floor(Math.random()*chars.length)]
  ).join('');

const codeLength = 4;

for(let c=0;c<14;c++){

  const col = document.createElement('div');
  col.className = 'column';

  const code = document.createElement('div');
  code.className = 'code';

  let html = '';

  for(let r=0;r<360;r++){

    const cls =
      (r%17===0)
        ? 'hot'
        : (r%5===0
            ? 'white'
            : (r%2
                ? 'mid'
                : 'soft'));

    html +=
      `<span class="${cls}">${randomCode(codeLength)}</span>`;
  }

  code.innerHTML = html + html;

  code.style.animationDuration =
    (42 + c * 1) + 's';

  code.style.animationDelay =
    (-c * .65) + 's';

  col.appendChild(code);
  stream.appendChild(col);
}

setInterval(()=>{
  document.querySelectorAll('.code span').forEach(el=>{
    if(Math.random()<.025){
      el.textContent=randomCode(codeLength);
    }
  });
},120);

const utcTime = document.getElementById('utc-time');

setInterval(()=>{

  document.querySelector('.tr').innerHTML =
    'UTC_' +
    new Date()
      .toISOString()
      .slice(11,23);

},37);

const logoOverlay = document.querySelector('.logo-overlay');

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    logoOverlay.classList.add('show');
  });
});

setTimeout(() => {
  logoOverlay.classList.remove('show');
}, 1800);

document.querySelector('.logo-link')?.addEventListener(
    'pointerenter',
    event => {
        event.currentTarget.classList.add('has-hovered');
    },
    { once: true }
);
</script>

</body>
